[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/var/run/supervisord.pid

[program:web]
command=/usr/local/bin/apache2-foreground
directory=/var/www/html
autostart=true
autorestart=true
priority=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:laravel-worker]
command=/usr/local/bin/php /var/www/html/artisan queue:work --queue=imports,default --tries=3 --timeout=300 --sleep=3
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
